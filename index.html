<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Retro Bird Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #70c5ce;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
        }

        #startScreen,
        #gameOverScreen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
        }

        #gameOverScreen {
            display: none;
            background: rgba(0, 0, 0, 0.5);
        }

        .title {
            font-size: 80px;
            color: white;
            text-shadow: 5px 5px #000;
            animation: float 2s infinite;
        }

        .tap {
            margin-top: 20px;
            font-size: 30px;
            color: white;
            text-shadow: 3px 3px #000;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0);
            }
        }

        .gameBox {
            background: #f5e6b3;
            padding: 40px;
            border: 8px solid #c97d1f;
            border-radius: 20px;
            text-align: center;
        }

        .scoreText {
            font-size: 40px;
            margin: 10px;
        }

        button {
            padding: 15px 30px;
            font-size: 25px;
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #ffd93d;
        }

        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 40px;
            color: white;
            text-shadow: 4px 4px #000;
            z-index: 5;
        }

        #best {
            position: absolute;
            top: 70px;
            left: 20px;
            font-size: 25px;
            color: yellow;
            text-shadow: 3px 3px #000;
            z-index: 5;
        }
    </style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3444644167228242"
     crossorigin="anonymous"></script>
</head>

<body>

    <div id="score">0</div>
    <div id="best">BEST : 0</div>

    <div id="startScreen">
        <div class="title">BIRDY BIRD</div>
        <div class="tap">TAP TO START</div>
    </div>

    <div id="gameOverScreen">
        <div class="gameBox">
            <h1>GAME OVER</h1>
            <div class="scoreText">SCORE</div>
            <div id="finalScore" class="scoreText">0</div>

            <div class="scoreText">BEST</div>
            <div id="bestScore" class="scoreText">0</div>

            <button onclick="restartGame()">
                RESTART
            </button>
        </div>
    </div>

    <canvas id="game"></canvas>

    <!-- Background Music -->
    <audio id="bgMusic" loop>
        <source
            src="https://pixabay.com/music/pop-escape-your-love-upbeat-fashion-pop-dance-412230.mp3"
            type="audio/mp3">
    </audio>

    <!-- Jump Sound -->
    <audio id="jumpSound">
        <source src="https://pixabay.com/sound-effects/film-special-effects-jump-sound-531048.mp3"
            type="audio/mp3">
    </audio>

    <!-- Score Sound -->
    <audio id="scoreSound">
        <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_b1c6d2dc77.mp3?filename=coin-110579.mp3"
            type="audio/mp3">
    </audio>

    <!-- Hit Sound -->
    <audio id="hitSound">
        <source
            src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_ef4bb8d5f7.mp3?filename=retro-death-110778.mp3"
            type="audio/mp3">
    </audio>

    <script>

        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let gravity = 0.22;
        let velocity = 0;
        let lift = -5.5;

        let score = 0;
        let best = localStorage.getItem("best") || 0;

        document.getElementById("best").innerHTML =
            "BEST : " + best;

        let gameStarted = false;
        let gameOver = false;

        const bgMusic = document.getElementById("bgMusic");
        const jumpSound = document.getElementById("jumpSound");
        const scoreSound = document.getElementById("scoreSound");
        const hitSound = document.getElementById("hitSound");

        const bird = {
            x: 120,
            y: 300,
            size: 30,
            wing: 0
        };

        const pipes = [];

        function createPipe() {

            const gap = 180;

            const topHeight =
                Math.random() * 300 + 50;

            pipes.push({
                x: canvas.width,
                width: 100,
                top: topHeight,
                bottom: canvas.height - topHeight - gap,
                passed: false
            });
        }

        setInterval(() => {

            if (gameStarted && !gameOver) {
                createPipe();
            }

        }, 2400);

        function drawBackground() {

            const gradient =
                ctx.createLinearGradient(
                    0, 0, 0, canvas.height
                );

            gradient.addColorStop(0, "#70c5ce");
            gradient.addColorStop(1, "#dff6ff");

            ctx.fillStyle = gradient;

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            // clouds
            for (let i = 0; i < 6; i++) {

                ctx.fillStyle =
                    "rgba(255,255,255,0.8)";

                ctx.beginPath();

                ctx.arc(
                    i * 300 + 100,
                    150,
                    50,
                    0,
                    Math.PI * 2
                );

                ctx.fill();
            }
        }

        function drawGround() {

            ctx.fillStyle = "#ded895";

            ctx.fillRect(
                0,
                canvas.height - 120,
                canvas.width,
                120
            );

            ctx.fillStyle = "#8bc34a";

            ctx.fillRect(
                0,
                canvas.height - 140,
                canvas.width,
                20
            );
        }

        function drawBird() {

            bird.wing += 0.2;

            ctx.save();

            ctx.translate(
                bird.x,
                bird.y
            );

            ctx.rotate(velocity * 0.05);

            // body
            ctx.fillStyle = "#ffd93d";

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                bird.size,
                0,
                Math.PI * 2
            );

            ctx.fill();

            // wing
            ctx.fillStyle = "#ffb703";

            ctx.beginPath();

            ctx.ellipse(
                -10,
                Math.sin(bird.wing) * 10,
                15,
                10,
                0,
                0,
                Math.PI * 2
            );

            ctx.fill();

            // eye
            ctx.fillStyle = "white";

            ctx.beginPath();

            ctx.arc(
                10,
                -10,
                8,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.fillStyle = "black";

            ctx.beginPath();

            ctx.arc(
                12,
                -10,
                3,
                0,
                Math.PI * 2
            );

            ctx.fill();

            // beak
            ctx.fillStyle = "orange";

            ctx.beginPath();

            ctx.moveTo(25, 0);
            ctx.lineTo(45, 5);
            ctx.lineTo(25, 10);

            ctx.fill();

            ctx.restore();
        }

        function drawPipes() {

            pipes.forEach(pipe => {

                // top pipe
                ctx.fillStyle = "#58be3f";

                ctx.fillRect(
                    pipe.x,
                    0,
                    pipe.width,
                    pipe.top
                );

                // bottom pipe
                ctx.fillRect(
                    pipe.x,
                    canvas.height - pipe.bottom,
                    pipe.width,
                    pipe.bottom
                );

                // pipe cap
                ctx.fillStyle = "#7ed957";

                ctx.fillRect(
                    pipe.x - 10,
                    pipe.top - 30,
                    pipe.width + 20,
                    30
                );

                ctx.fillRect(
                    pipe.x - 10,
                    canvas.height - pipe.bottom,
                    pipe.width + 20,
                    30
                );
            });
        }

        function updateBird() {

            velocity += gravity;

            bird.y += velocity;

            if (
                bird.y + bird.size >
                canvas.height - 120
            ) {
                endGame();
            }

            if (bird.y < 0) {
                bird.y = 0;
            }
        }

        function updatePipes() {

            pipes.forEach(pipe => {

                pipe.x -= 2.8;

                // collision
                if (

                    bird.x + bird.size > pipe.x &&
                    bird.x - bird.size <
                    pipe.x + pipe.width &&

                    (
                        bird.y - bird.size <
                        pipe.top ||

                        bird.y + bird.size >
                        canvas.height - pipe.bottom
                    )

                ) {
                    endGame();
                }

                // score
                if (!pipe.passed &&
                    pipe.x < bird.x) {

                    pipe.passed = true;

                    score++;

                    scoreSound.play();

                    document.getElementById(
                        "score"
                    ).innerHTML = score;

                    if (score > best) {

                        best = score;

                        localStorage.setItem(
                            "best",
                            best
                        );

                        document.getElementById(
                            "best"
                        ).innerHTML =
                            "BEST : " + best;
                    }
                }

            });

        }

        function animate() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            drawBackground();

            drawPipes();

            drawGround();

            drawBird();

            if (gameStarted && !gameOver) {

                updateBird();

                updatePipes();
            }

            requestAnimationFrame(animate);
        }

        animate();

        function flap() {

            if (!gameStarted) {

                gameStarted = true;

                bgMusic.volume = 0.4;

                bgMusic.play();

                document.getElementById(
                    "startScreen"
                ).style.display = "none";
            }

            if (!gameOver) {

                velocity = lift;

                jumpSound.currentTime = 0;

                jumpSound.play();
            }
        }

        window.addEventListener(
            "click",
            flap
        );

        window.addEventListener(
            "touchstart",
            flap
        );

        window.addEventListener(
            "keydown",
            e => {
                if (e.code === "Space") {
                    flap();
                }
            }
        );

        function endGame() {

            if (gameOver) return;

            gameOver = true;

            hitSound.play();

            bgMusic.pause();

            document.getElementById(
                "gameOverScreen"
            ).style.display = "flex";

            document.getElementById(
                "finalScore"
            ).innerHTML = score;

            document.getElementById(
                "bestScore"
            ).innerHTML = best;
        }

        function restartGame() {

            bird.y = 300;

            velocity = 0;

            pipes.length = 0;

            score = 0;

            gameOver = false;

            document.getElementById(
                "score"
            ).innerHTML = "0";

            document.getElementById(
                "gameOverScreen"
            ).style.display = "none";

            bgMusic.play();
        }

        window.addEventListener(
            "resize",
            () => {

                canvas.width =
                    window.innerWidth;

                canvas.height =
                    window.innerHeight;
            }
        );

    </script>

</body>

</html>
